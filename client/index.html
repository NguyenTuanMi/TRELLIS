<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forge — Image to 3D</title>
<script type="module" src="https://cdnjs.cloudflare.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  :root {
    --bg: #14161a;
    --panel: #1b1e24;
    --panel-2: #22262e;
    --border: #2c313b;
    --text: #e7e9ec;
    --text-dim: #8b929e;
    --accent: #5ee6c2;
    --accent-dim: #2f4d46;
    --danger: #e6725e;
    --mono: "IBM Plex Mono", "SF Mono", Consolas, monospace;
    --sans: "Inter", -apple-system, "Segoe UI", sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
  }

  body {
    display: grid;
    grid-template-columns: 340px 1fr;
    grid-template-rows: 56px 1fr;
    grid-template-areas:
      "header header"
      "sidebar viewer";
    height: 100vh;
    overflow: hidden;
  }

  header {
    grid-area: header;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 20px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }

  .logo {
    font-family: var(--mono);
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text);
  }
  .logo span { color: var(--accent); }

  .status-pill {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    padding: 5px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    color: var(--text-dim);
  }
  .status-pill.connected { color: var(--accent); border-color: var(--accent-dim); }
  .status-pill.down { color: var(--danger); border-color: #4a2c27; }

  aside {
    grid-area: sidebar;
    border-right: 1px solid var(--border);
    background: var(--panel);
    padding: 20px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .field-label {
    font-family: var(--mono);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    margin-bottom: 8px;
    display: block;
  }

  input[type="text"] {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 10px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 12.5px;
  }
  input[type="text"]:focus { outline: none; border-color: var(--accent); }

  .dropzone {
    border: 1.5px dashed var(--border);
    border-radius: 10px;
    padding: 22px 14px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    background: var(--panel-2);
  }
  .dropzone:hover, .dropzone.drag { border-color: var(--accent); background: #1c2a26; }
  .dropzone p { margin: 0; font-size: 13px; color: var(--text-dim); }
  .dropzone strong { color: var(--text); }

  #file-input { display: none; }

  .thumbs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
  }
  .thumb {
    position: relative;
    aspect-ratio: 1;
    border-radius: 6px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .thumb button {
    position: absolute;
    top: 3px; right: 3px;
    width: 18px; height: 18px;
    border-radius: 50%;
    border: none;
    background: rgba(0,0,0,0.65);
    color: #fff;
    font-size: 11px;
    line-height: 1;
    cursor: pointer;
  }

  select {
    width: 100%;
    background: var(--panel-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 10px;
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 12.5px;
  }

  .run-btn {
    margin-top: auto;
    width: 100%;
    padding: 13px;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #0c1512;
    font-weight: 600;
    font-size: 13.5px;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .run-btn:hover { opacity: 0.9; }
  .run-btn:disabled {
    background: var(--panel-2);
    color: var(--text-dim);
    cursor: not-allowed;
  }

  .log {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    white-space: pre-wrap;
    line-height: 1.5;
    min-height: 18px;
  }
  .log.error { color: var(--danger); }
  .log.ok { color: var(--accent); }

  main#viewer-area {
    grid-area: viewer;
    position: relative;
    background:
      radial-gradient(circle at 50% 40%, #1d2027 0%, var(--bg) 70%);
  }

  model-viewer {
    width: 100%;
    height: 100%;
    --poster-color: transparent;
  }

  .empty-state {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--text-dim);
    text-align: center;
    pointer-events: none;
  }
  .empty-state .glyph {
    font-family: var(--mono);
    font-size: 34px;
    color: var(--border);
  }
  .empty-state p { margin: 0; font-size: 13px; max-width: 260px; }

  .viewer-toolbar {
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    background: rgba(27, 30, 36, 0.9);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 6px;
    backdrop-filter: blur(6px);
  }
  .viewer-toolbar button {
    background: transparent;
    border: none;
    color: var(--text-dim);
    padding: 7px 12px;
    border-radius: 7px;
    font-family: var(--mono);
    font-size: 11.5px;
    cursor: pointer;
  }
  .viewer-toolbar button:hover { background: var(--panel-2); color: var(--text); }

  .download-link {
    position: absolute;
    top: 18px;
    right: 18px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--accent);
    text-decoration: none;
    border: 1px solid var(--accent-dim);
    padding: 7px 12px;
    border-radius: 7px;
    display: none;
  }
  .download-link:hover { background: var(--accent-dim); }
</style>
</head>
<body>

<header>
  <div class="logo">forge <span>/ image → 3d</span></div>
  <div id="status" class="status-pill">checking server…</div>
</header>

<aside>
  <div>
    <label class="field-label">Server URL</label>
    <input id="server-url" type="text" value="http://localhost:8000" />
  </div>

  <div>
    <label class="field-label">Images</label>
    <div id="dropzone" class="dropzone">
      <p><strong>Click to upload</strong> or drag images here</p>
      <p style="margin-top:4px;">Multiple angles of the same object work best</p>
    </div>
    <input id="file-input" type="file" accept="image/*" multiple />
  </div>

  <div id="thumbs" class="thumbs"></div>

  <div>
    <label class="field-label">Fusion mode</label>
    <select id="algo-select">
      <option value="stochastic">Stochastic (sharper detail)</option>
      <option value="multidiffusion">Multidiffusion (more consistent)</option>
    </select>
  </div>

  <button id="run-btn" class="run-btn" disabled>Upload images to begin</button>
  <div id="log" class="log"></div>
</aside>

<main id="viewer-area">
  <div id="empty-state" class="empty-state">
    <div class="glyph">◇</div>
    <p>Your generated model will appear here. Upload a few images of your object and hit run.</p>
  </div>

  <model-viewer
    id="viewer"
    style="display:none"
    camera-controls
    touch-action="pan-y"
    auto-rotate
    auto-rotate-delay="0"
    rotation-per-second="18deg"
    interaction-prompt="none"
    shadow-intensity="1"
    exposure="1.1"
    environment-image="neutral"
  ></model-viewer>

  <a id="download-link" class="download-link" download="model.glb">↓ download .glb</a>

  <div id="viewer-toolbar" class="viewer-toolbar" style="display:none">
    <button id="toggle-rotate">⏸ pause spin</button>
    <button id="reset-cam">⟲ reset view</button>
  </div>
</main>

<script>
const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('file-input');
const thumbsEl = document.getElementById('thumbs');
const runBtn = document.getElementById('run-btn');
const logEl = document.getElementById('log');
const serverUrlInput = document.getElementById('server-url');
const statusEl = document.getElementById('status');
const viewer = document.getElementById('viewer');
const emptyState = document.getElementById('empty-state');
const downloadLink = document.getElementById('download-link');
const toolbar = document.getElementById('viewer-toolbar');
const toggleRotateBtn = document.getElementById('toggle-rotate');
const resetCamBtn = document.getElementById('reset-cam');
const algoSelect = document.getElementById('algo-select');

let files = [];

function serverUrl() {
  return serverUrlInput.value.trim().replace(/\/$/, '');
}

function setLog(msg, cls) {
  logEl.textContent = msg;
  logEl.className = 'log' + (cls ? ' ' + cls : '');
}

function updateRunButton() {
  runBtn.disabled = files.length === 0;
  runBtn.textContent = files.length === 0
    ? 'Upload images to begin'
    : `Run — generate 3D model (${files.length} image${files.length > 1 ? 's' : ''})`;
}

function renderThumbs() {
  thumbsEl.innerHTML = '';
  files.forEach((file, i) => {
    const url = URL.createObjectURL(file);
    const div = document.createElement('div');
    div.className = 'thumb';
    div.innerHTML = `<img src="${url}" /><button title="remove">×</button>`;
    div.querySelector('button').onclick = () => {
      files.splice(i, 1);
      renderThumbs();
      updateRunButton();
    };
    thumbsEl.appendChild(div);
  });
}

dropzone.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  files.push(...Array.from(e.target.files));
  renderThumbs();
  updateRunButton();
  fileInput.value = '';
});

['dragover', 'dragleave', 'drop'].forEach(evt => {
  dropzone.addEventListener(evt, (e) => {
    e.preventDefault();
    dropzone.classList.toggle('drag', evt === 'dragover');
  });
});
dropzone.addEventListener('drop', (e) => {
  const dropped = Array.from(e.dataTransfer.files).filter(f => f.type.startsWith('image/'));
  files.push(...dropped);
  renderThumbs();
  updateRunButton();
});

async function checkHealth() {
  try {
    const res = await fetch(`${serverUrl()}/health`, { signal: AbortSignal.timeout(4000) });
    if (!res.ok) throw new Error();
    statusEl.textContent = 'server connected';
    statusEl.className = 'status-pill connected';
  } catch {
    statusEl.textContent = 'server unreachable';
    statusEl.className = 'status-pill down';
  }
}
checkHealth();
serverUrlInput.addEventListener('change', checkHealth);

runBtn.addEventListener('click', async () => {
  if (files.length === 0) return;

  runBtn.disabled = true;
  runBtn.textContent = 'Generating… this can take a minute';
  setLog('Uploading images and running TRELLIS on the remote server…');

  const form = new FormData();
  files.forEach(f => form.append('images', f));

  try {
    const res = await fetch(`${serverUrl()}/generate?multiimage_algo=${algoSelect.value}`, {
      method: 'POST',
      body: form,
    });

    if (!res.ok) {
      const text = await res.text();
      throw new Error(`Server returned ${res.status}: ${text}`);
    }

    const data = await res.json();
    const modelUrl = `${serverUrl()}${data.download_url}`;

    viewer.src = modelUrl;
    viewer.style.display = 'block';
    emptyState.style.display = 'none';
    toolbar.style.display = 'flex';
    downloadLink.href = modelUrl;
    downloadLink.style.display = 'inline-block';

    setLog('Model generated successfully.', 'ok');
  } catch (err) {
    setLog(`Failed: ${err.message}`, 'error');
  } finally {
    updateRunButton();
  }
});

toggleRotateBtn.addEventListener('click', () => {
  const spinning = viewer.hasAttribute('auto-rotate');
  if (spinning) {
    viewer.removeAttribute('auto-rotate');
    toggleRotateBtn.textContent = '▶ resume spin';
  } else {
    viewer.setAttribute('auto-rotate', '');
    toggleRotateBtn.textContent = '⏸ pause spin';
  }
});

resetCamBtn.addEventListener('click', () => {
  viewer.cameraOrbit = '0deg 75deg 105%';
  viewer.cameraTarget = 'auto';
});
</script>

</body>
</html>
